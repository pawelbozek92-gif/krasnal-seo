name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Static checks of dist/
        run: npm run check:dist

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E + accessibility tests
        run: npm run test:e2e

      - name: Lighthouse CI
        run: npm run test:lighthouse
        env:
          LHCI_RUNS: 3

      - name: PHP contact handler smoke test
        run: bash tests/php/contact-smoke.sh

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-reports
          path: |
            playwright-report/
            lighthouse-reports/
          retention-days: 14
